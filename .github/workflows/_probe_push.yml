name: Probe push execution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_probe_push.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > ACTIONS_PROBE_OK.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ACTIONS_PROBE_OK.txt
          git commit -m 'Actions probe [skip ci]'
          git push
