name: Run full AUMARA booking photo pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-booking-ready-v2.yml'
permissions:
  contents: write
concurrency:
  group: aumara-booking-ready-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check gdown pillow
      - name: Extract authoritative source map and builder
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          text=Path('.github/workflows/build-booking-ready.yml').read_text(encoding='utf-8')
          m=re.search(r"cat > /tmp/aumara_source_map\.json\.gz\.b64 <<'B64'\n(.*?)\n\s*B64", text, re.S)
          if not m: raise SystemExit('source map block not found')
          b64=''.join(line.strip() for line in m.group(1).splitlines())
          Path('/tmp/aumara_source_map.json').write_bytes(gzip.decompress(base64.b64decode(b64)))
          marker="cat > /tmp/build_booking_pack.py <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY", start)
          block=text[start:end]
          lines=block.splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/build_booking_pack.py').write_text(script,encoding='utf-8')
          print('EXTRACT_OK')
          PY
      - name: Build all 63 categorized images
        run: python /tmp/build_booking_pack.py
      - name: Verify and commit
        run: |
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          root=pathlib.Path('booking-ready')
          m=json.load(open(root/'manifest.json'))
          assert m['source_items']==63
          assert m['output_items']+m['duplicates_removed']==63
          assert set(m['category_counts']) <= {'GENERAL','CHALET','CHALET_SUPERIOR'}
          n=0
          for cat in ('GENERAL','CHALET','CHALET_SUPERIOR'):
            files=list((root/cat).glob('*.jpg'))
            assert len(files)==m['category_counts'].get(cat,0)
            for f in files:
              with Image.open(f) as im: assert im.format=='JPEG'
            n += len(files)
          assert n==m['output_items']
          for item in m['items']:
            with Image.open(root/item['output_path']) as im:
              assert list(im.size)==[item['width'],item['height']]
          print('VERIFY_OK',m['category_counts'],'duplicates',m['duplicates_removed'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booking-ready
          git commit -m 'Build full AUMARA booking-ready photo pack [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
