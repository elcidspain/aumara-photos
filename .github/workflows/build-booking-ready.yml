name: Build AUMARA Booking Ready Photo Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-booking-ready.yml"

permissions:
  contents: write

concurrency:
  group: aumara-booking-ready-pack
  cancel-in-progress: true

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image/download dependencies
        run: python -m pip install --disable-pip-version-check gdown pillow

      - name: Materialize authoritative 63-photo source map
        shell: bash
        run: |
          cat > /tmp/aumara_source_map.json.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/aumara_source_map.json.gz.b64 | gzip -d > /tmp/aumara_source_map.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/aumara_source_map.json'))
          assert len(d['items']) == 63, len(d['items'])
          assert set(x['bucket'] for x in d['items']) == {'GENERAL','CHALET','CHALET_SUPERIOR'}
          assert len({x['sha256'] for x in d['items']}) == 63
          print('SOURCE_MAP_OK', len(d['items']))
          PY

      - name: Download, normalize, deduplicate and classify full archive
        shell: bash
        run: |
          cat > /tmp/build_booking_pack.py <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, shutil, subprocess, sys, tempfile, time
          from collections import Counter
          from PIL import Image

          ROOT = pathlib.Path('booking-ready')
          CATEGORIES = ['GENERAL','CHALET','CHALET_SUPERIOR']
          SOURCE_MAP = json.load(open('/tmp/aumara_source_map.json', encoding='utf-8'))

          if ROOT.exists():
              shutil.rmtree(ROOT)
          for cat in CATEGORIES:
              (ROOT/cat).mkdir(parents=True, exist_ok=True)
          tmp = pathlib.Path(tempfile.mkdtemp(prefix='aumara-booking-'))

          def sha256_file(path: pathlib.Path) -> str:
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download(item, idx):
              target=tmp/f'{idx:03d}_{item["filename"].replace("/","_")}'
              cmd=[sys.executable,'-m','gdown',item['drive_id'],'-O',str(target)]
              for attempt in range(1,4):
                  p=subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  if p.returncode == 0 and target.exists() and target.stat().st_size:
                      return target
                  if target.exists(): target.unlink()
                  if attempt == 3:
                      print(p.stdout[-3000:])
                      raise RuntimeError(f'download failed {item["filename"]} id={item["drive_id"]}')
                  time.sleep(attempt*2)
              raise AssertionError('unreachable')

          role_order = {
              'site_landscape':0,'exterior_multi_house':1,'exterior_patios':2,'exterior_single_house':3,
              'night_ambience':4,'night_exterior':5,
              'interior_living':0,'interior_bed':1,'interior_kitchen':2,'interior_dining_kitchen':3,
              'interior_dining':4,'interior_glazing':5,'interior_transition':6,'interior_bath':7,
          }
          indexed=list(enumerate(SOURCE_MAP['items']))
          indexed.sort(key=lambda pair:(CATEGORIES.index(pair[1]['bucket']), role_order.get(pair[1]['role'],99), pair[0]))

          seen_pixel_hash={}
          seen_source_sha={}
          seq=Counter()
          outputs=[]
          duplicates=[]

          for source_index, item in indexed:
              src=download(item, source_index)
              actual_size=src.stat().st_size
              actual_sha=sha256_file(src)
              if actual_sha != item['sha256']:
                  raise RuntimeError(f'SHA mismatch {item["filename"]} expected={item["sha256"]} got={actual_sha}')
              if actual_size != item['bytes']:
                  raise RuntimeError(f'byte mismatch {item["filename"]} expected={item["bytes"]} got={actual_size}')

              with Image.open(src) as im:
                  im.load()
                  width,height=im.size
                  if (width,height) != (item['width'],item['height']):
                      raise RuntimeError(f'dimension mismatch {item["filename"]} expected={item["width"]}x{item["height"]} got={width}x{height}')
                  rgb = im.convert('RGB')
                  pixel_sha=hashlib.sha256(width.to_bytes(4,'big')+height.to_bytes(4,'big')+rgb.tobytes()).hexdigest()

                  duplicate_of = seen_pixel_hash.get(pixel_sha) or seen_source_sha.get(actual_sha)
                  if duplicate_of:
                      duplicates.append({'filename':item['filename'],'bucket':item['bucket'],'source_sha256':actual_sha,'duplicate_of':duplicate_of,'reason':'identical_decoded_pixels_or_source_sha'})
                      continue

                  seq[item['bucket']] += 1
                  safe_stem=pathlib.Path(item['filename']).stem.replace(' ','_').replace('(','').replace(')','')
                  role=item['role'].replace('/','_')
                  out_name=f'{seq[item["bucket"]]:03d}_{role}_{safe_stem}.jpg'
                  out=ROOT/item['bucket']/out_name
                  suffix=src.suffix.lower()
                  if suffix in ('.jpg','.jpeg'):
                      shutil.copyfile(src,out)
                  else:
                      rgb.save(out, format='JPEG', quality=96, subsampling=0, optimize=True)

              with Image.open(out) as check:
                  out_dims=check.size
                  out_format=check.format
              if out_dims != (item['width'],item['height']):
                  raise RuntimeError(f'output dimension changed {item["filename"]} -> {out_dims}')
              if out_format != 'JPEG':
                  raise RuntimeError(f'output is not JPEG {out} format={out_format}')

              output_sha=sha256_file(out)
              seen_pixel_hash[pixel_sha]=f'{item["bucket"]}/{out_name}'
              seen_source_sha[actual_sha]=f'{item["bucket"]}/{out_name}'
              outputs.append({**item,'output_path':f'{item["bucket"]}/{out_name}','output_sha256':output_sha,'output_bytes':out.stat().st_size,'output_width':out_dims[0],'output_height':out_dims[1],'output_format':'JPEG','source_preserved_byte_for_byte': suffix in ('.jpg','.jpeg')})

          counts=Counter(x['bucket'] for x in outputs)
          if sum(counts.values()) + len(duplicates) != 63:
              raise RuntimeError('archive accounting mismatch')
          if set(counts)-set(CATEGORIES):
              raise RuntimeError('unexpected category')

          final_manifest={'schema':'aumara.booking-ready.pack','version':'1.0.0','source_archives':SOURCE_MAP['source_archives'],'source_items':63,'output_items':len(outputs),'duplicates_removed':len(duplicates),'category_counts':dict(counts),'policy':{'categories':CATEGORIES,'resolution':'pixel dimensions preserved; no resize/downscale','jpeg_sources':'copied byte-for-byte','png_sources':'RGB JPEG quality 96, 4:4:4; same pixel dimensions','dedup':'exact source SHA or exact decoded RGB pixel hash only'},'duplicates':duplicates,'items':outputs}
          (ROOT/'manifest.json').write_text(json.dumps(final_manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (ROOT/'source-map.json').write_text(json.dumps(SOURCE_MAP,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (ROOT/'README.txt').write_text('AUMARA BOOKING READY PHOTO PACK\nGENERAL / CHALET / CHALET_SUPERIOR\nAll output files: JPEG. Pixel dimensions preserved. No resizing/downscaling.\n'+f'Source items: 63; outputs: {len(outputs)}; exact duplicates removed: {len(duplicates)}.\n',encoding='utf-8')
          print('PACK_OK', json.dumps({'source':63,'outputs':len(outputs),'duplicates':len(duplicates),'counts':dict(counts)},sort_keys=True))
          PY
          python /tmp/build_booking_pack.py

      - name: Verify pack invariants
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          root=pathlib.Path('booking-ready')
          m=json.load(open(root/'manifest.json'))
          assert m['source_items'] == 63
          assert m['output_items'] + m['duplicates_removed'] == 63
          assert set(m['category_counts']) <= {'GENERAL','CHALET','CHALET_SUPERIOR'}
          actual=[]
          for cat in ('GENERAL','CHALET','CHALET_SUPERIOR'):
              files=sorted((root/cat).glob('*.jpg'))
              assert len(files) == m['category_counts'].get(cat,0), (cat,len(files),m['category_counts'])
              for f in files:
                  with Image.open(f) as im:
                      assert im.format == 'JPEG'
                  actual.append(f)
          assert len(actual) == m['output_items']
          for item in m['items']:
              p=root/item['output_path']
              with Image.open(p) as im:
                  assert list(im.size) == [item['width'],item['height']], (p,im.size,item['width'],item['height'])
          print('VERIFY_OK', m['category_counts'], 'duplicates_removed', m['duplicates_removed'])
          PY

      - name: Commit full categorized pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking-ready
          if git diff --cached --quiet; then
            echo "No pack changes"
            exit 0
          fi
          git commit -m "Build full AUMARA Beds24 Booking photo pack [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
