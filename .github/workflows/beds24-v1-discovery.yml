name: Beds24 V1 Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/beds24-v1.trigger'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/beds24-v1-pr.trigger'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Discover existing Beds24 V1 bindings and live content shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          secrets=json.loads(os.environ.get('ALL_SECRETS_JSON') or '{}')
          names=sorted(secrets)

          def pick(kind):
              out=[]
              for n in names:
                  u=n.upper()
                  if kind=='api':
                      if (('BEDS24' in u and 'API' in u and 'KEY' in u and 'PROP' not in u) or u in {'APIKEY','API_KEY','BEDS24APIKEY','BEDS24_API_KEY'}): out.append(n)
                  else:
                      if ((('BEDS24' in u or 'PROP' in u) and 'PROP' in u and 'KEY' in u) or u in {'PROPKEY','PROP_KEY','BEDS24PROPKEY','BEDS24_PROP_KEY'}): out.append(n)
              return out

          api_names=pick('api'); prop_names=pick('prop')
          print('api_key_secret_names='+json.dumps(api_names))
          print('prop_key_secret_names='+json.dumps(prop_names))
          print('secret_values_exposed=false')
          if len(api_names)!=1 or len(prop_names)!=1:
              print('status='+('MISSING_MATCH' if not api_names or not prop_names else 'AMBIGUOUS_MATCH'))
              raise SystemExit(0)

          payload=json.dumps({'authentication':{'apiKey':secrets[api_names[0]].strip(),'propKey':secrets[prop_names[0]].strip()}}).encode()
          req=urllib.request.Request('https://api.beds24.com/json/getPropertyContent',data=payload,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'AUMARA-photo-sync/1.0'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=45) as resp:
                  raw=resp.read(); status=int(resp.status)
          except urllib.error.HTTPError as e:
              raw=e.read(); status=int(e.code)
          print('http_status='+str(status))
          try: body=json.loads(raw.decode('utf-8','replace')) if raw else {}
          except Exception: body={}

          def safe(x,depth=0):
              if depth>8: return '[depth]'
              if isinstance(x,dict):
                  o={}
                  for k,v in x.items():
                      kl=str(k).lower()
                      if any(s in kl for s in ('apikey','propkey','token','password','secret','email','phone','address')): o[str(k)]='[redacted]'
                      elif isinstance(v,(dict,list)): o[str(k)]=safe(v,depth+1)
                      elif any(s in kl for s in ('id','name','title','status','picture','image','photo','url','room','property','display')): o[str(k)]=v
                  return o
              if isinstance(x,list): return [safe(v,depth+1) for v in x[:200]]
              return x

          print('response_shape='+json.dumps(safe(body),ensure_ascii=False,separators=(',',':')))
          print('status='+('LIVE_CONTENT_READ_OK' if 200 <= status < 300 else 'LIVE_CONTENT_READ_FAILED'))
          if not 200 <= status < 300: raise SystemExit(3)
          PY
